<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración de Cuenta</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-6 antialiased selection:bg-blue-500 selection:text-white">

    <div class="bg-slate-800/80 backdrop-blur-md border border-slate-700 p-8 rounded-3xl max-w-md w-full shadow-2xl">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-white tracking-tight flex items-center space-x-2">
                <span>⚙️</span>
                <span>Configuración</span>
            </h1>
            <a href="/home" class="text-slate-400 hover:text-white transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg>
            </a>
        </div>
        
        <p class="text-slate-400 text-sm mb-6">Administra los ajustes de tu perfil personal.</p>
        
        <div class="space-y-5">
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase mb-2">Nombre de Usuario</label>
                <input type="text" id="configNombre" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500 transition-colors" placeholder="Cargando...">
            </div>
            
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase mb-2">Correo Electrónico</label>
                <input type="email" id="configEmail" disabled class="w-full bg-slate-900/50 border border-slate-700/50 rounded-xl px-4 py-3 text-sm text-slate-500 cursor-not-allowed" placeholder="Cargando...">
                <p class="text-[10px] text-slate-500 mt-1">El correo no se puede cambiar.</p>
            </div>

            <button onclick="guardarConfiguracion()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-3 rounded-xl text-sm transition-all shadow-lg shadow-blue-600/20 mt-4">
                Guardar Cambios
            </button>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const token = localStorage.getItem("token");
            if (!token) {
                window.location.href = "/";
                return;
            }

            try {
                const res = await fetch("/api/me", {
                    headers: { "Authorization": `Bearer ${token}` }
                });
                if (res.ok) {
                    const userData = await res.json();
                    document.getElementById("configNombre").value = userData.nombre;
                    document.getElementById("configEmail").value = userData.email;
                }
            } catch (err) {
                console.error("Error al cargar perfil", err);
            }
        });

        async function guardarConfiguracion() {
            const token = localStorage.getItem("token");
            const nuevoNombre = document.getElementById("configNombre").value.trim();

            if (!nuevoNombre) {
                alert("El nombre no puede estar vacío.");
                return;
            }

            try {
                const res = await fetch("/api/me", {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`
                    },
                    body: JSON.stringify({ nombre: nuevoNombre })
                });

                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem("nombre", data.nombre);
                    alert("Nombre actualizado. Vuelve a iniciar sesión para aplicar el cambio en el chat.");
                    localStorage.removeItem("token");
                    window.location.href = "/";
                } else {
                    alert(data.detail || "Error al guardar los cambios.");
                }
            } catch (error) {
                console.error("Error de red:", error);
                alert("No se pudo conectar con el servidor.");
            }
        }
    </script>
</body>
</html>
