<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sala de Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">
    
    <header class="bg-slate-800 border-b border-slate-700 h-16 flex justify-between items-center px-6 sticky top-0 z-50">
        <h1 id="salaTitulo" class="text-lg font-bold text-white flex items-center space-x-2">
            <span>💬</span> <span>Cargando Sala...</span>
        </h1>
        <a href="/home" class="bg-slate-700/50 hover:bg-slate-700 text-slate-300 text-xs font-medium px-4 py-2 rounded-lg transition-all border border-slate-600/50">
            &larr; Volver
        </a>
    </header>

    <main class="flex-grow p-4 md:p-6 max-w-5xl mx-auto w-full flex flex-col justify-between h-[calc(100vh-4rem)]">
        <!-- Caja de mensajes -->
        <div id="mensajesBox" class="bg-slate-800/40 border border-slate-700/60 rounded-2xl p-4 flex-grow overflow-y-auto mb-4 space-y-4">
            <div class="text-center">
                <span class="text-xs bg-slate-700 text-slate-400 px-3 py-1 rounded-full">Conectando al servidor en tiempo real...</span>
            </div>
        </div>

        <!-- Input de envío -->
        <form id="chatForm" class="flex space-x-3 bg-slate-800/80 p-2 rounded-2xl border border-slate-700">
            <input type="text" id="mensajeInput" autocomplete="off" placeholder="Escribe tu mensaje aquí..." class="flex-grow bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500 text-white">
            <button type="submit" class="bg-blue-600 hover:bg-blue-500 px-6 py-3 rounded-xl font-medium text-sm transition-all shadow-md text-white flex items-center space-x-2">
                <span>Enviar</span>
            </button>
        </form>
    </main>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const salaId = urlParams.get('sala');
    const token = localStorage.getItem("token");
    const nombreUsuario = localStorage.getItem("nombre") || "Anónimo";

    if (!token || !salaId) {
        window.location.href = "/home";
    }

    document.getElementById('salaTitulo').innerHTML = `<span>💬</span> <span>Sala #${salaId}</span>`;
    const box = document.getElementById('mensajesBox');

    let ws = null;
    let intentosReconexion = 0;
    const MAX_INTENTOS = 5;
    let cierreManual = false;

    async function cargarHistorial() {
        try {
            const res = await fetch(`/api/salas/${salaId}/mensajes`, {
                headers: { "Authorization": `Bearer ${token}` }
            });
            if (!res.ok) {
                box.innerHTML = `<div class="text-center"><span class="text-xs bg-rose-500/10 text-rose-400 px-3 py-1 rounded-full">No tienes acceso a esta sala.</span></div>`;
                return;
            }
            const historial = await res.json();
            historial.forEach(m => pintarMensaje(m.nombre_usuario, m.mensaje, m.nombre_usuario === nombreUsuario));
            box.scrollTop = box.scrollHeight;
        } catch (error) {
            console.error("Error al cargar historial:", error);
        }
    }

    function pintarMensaje(usuario, mensaje, esMio) {
        const alignClass = esMio ? "flex justify-end" : "flex justify-start";
        const bubbleClass = esMio
            ? "bg-blue-600/20 border-blue-500/30 text-blue-100"
            : "bg-slate-700/50 border-slate-600/50 text-slate-200";

        box.innerHTML += `
            <div class="${alignClass}">
                <div class="border ${bubbleClass} px-4 py-2 rounded-2xl max-w-[75%] shadow-sm">
                    ${!esMio ? `<p class="text-[10px] font-bold text-slate-400 mb-0.5">${usuario}</p>` : ''}
                    <p class="text-sm">${mensaje}</p>
                </div>
            </div>
        `;
    }

    function mostrarEstado(texto, tipo = "info") {
        const colores = {
            info: "bg-slate-700 text-slate-400",
            ok: "bg-emerald-500/10 text-emerald-400 border border-emerald-500/20",
            error: "bg-rose-500/10 text-rose-400 border border-rose-500/20"
        };
        box.innerHTML += `<div class="text-center"><span class="text-xs ${colores[tipo]} px-3 py-1 rounded-full">${texto}</span></div>`;
        box.scrollTop = box.scrollHeight;
    }

    function conectarWebSocket() {
        ws = new WebSocket(`ws://127.0.0.1:8000/ws/sala/${salaId}?token=${token}`);

        ws.onopen = () => {
            intentosReconexion = 0;
            mostrarEstado("Conexión establecida.", "ok");
        };

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            pintarMensaje(data.usuario, data.mensaje, data.usuario === nombreUsuario);
            box.scrollTop = box.scrollHeight;
        };

        ws.onerror = () => {
            mostrarEstado("Error de conexión.", "error");
        };

        ws.onclose = (event) => {
            if (cierreManual) return;

            // 1008: el backend rechazó la conexión a propósito (token inválido o no eres miembro)
            if (event.code === 1008) {
                mostrarEstado("No se pudo conectar (sesión inválida o sin acceso a la sala).", "error");
                return;
            }

            if (intentosReconexion >= MAX_INTENTOS) {
                mostrarEstado("No se pudo restablecer la conexión. Recarga la página.", "error");
                return;
            }

            intentosReconexion++;
            const espera = Math.min(1000 * (2 ** intentosReconexion), 15000);
            mostrarEstado(`Conexión perdida. Reintentando en ${espera / 1000}s...`, "error");
            setTimeout(conectarWebSocket, espera);
        };
    }

    cargarHistorial();
    conectarWebSocket();

    window.addEventListener("beforeunload", () => {
        cierreManual = true;
        if (ws) ws.close();
    });

    document.getElementById('chatForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const input = document.getElementById('mensajeInput');
        if (!input.value.trim()) return;

        if (!ws || ws.readyState !== WebSocket.OPEN) {
            mostrarEstado("No estás conectado. Espera a que se restablezca la conexión.", "error");
            return;
        }

        ws.send(JSON.stringify({ mensaje: input.value }));
        input.value = '';
    });
</script>
</body>
</html>
